<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fischer's Adventure</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1a1a2e;
      }
      #game-container {
        width: 100%;
        height: 100%;
        position: relative;
      }
      #game-container canvas {
        display: block;
      }
      /* Phaser DOM layer — must not steal clicks when empty */
      #game-container > div {
        z-index: 10;
        pointer-events: none !important;
      }
      #game-container > div input,
      #game-container > div textarea,
      #game-container > div button,
      #game-container > div select {
        pointer-events: auto !important;
      }
    </style>
  </head>
  <body>
    <div id="game-container"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
